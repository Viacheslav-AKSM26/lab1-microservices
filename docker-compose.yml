services:
  inventory-service:
    build: ./inventory_service
    container_name: inventory-service-${STUDENT_N}
    ports:
      - "${INVENTORY_PORT}:8000"
    environment:
      - STUDENT_N=${STUDENT_N}
    networks:
      - lab-network

  order-service:
    build: ./order_service
    container_name: order-service-${STUDENT_N}
    ports:
      - "${ORDER_PORT}:8000"
    environment:
      - STUDENT_N=${STUDENT_N}
      - INVENTORY_URL=http://inventory-service:8000
    depends_on:
      - inventory-service
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge
